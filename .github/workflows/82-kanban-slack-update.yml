name: "82-kanban-slack-update.yml"

# Instructions to set up the workflow can be found here:
# <https://ucsb-cs156.github.io/topics/github_actions/workflow_82.html>
#
# This is a thin wrapper around the reusable workflow maintained in
# <https://github.com/ucsb-cs156/workflows/blob/main/.github/workflows/82-kanban-slack-update.yml>
# The start and end dates come from the organization variables
# TEAM02_START_DATE and TEAM02_END_DATE.

on:
  schedule:
    # Target (Pacific local time):
    #   * 4:30 PM every day (Sun, Mon, Tue, Wed, Thu, Fri, Sat)
    #   * 7:00 PM on Tuesdays, Wednesdays and Thursdays (class days)
    #
    # GitHub cron schedules are always UTC and do not follow daylight saving
    # time, so each target is scheduled at BOTH possible UTC times (PDT = UTC-7
    # and PST = UTC-8), and the time-check job below decides which run is
    # actually at the intended Pacific time today; the other one is skipped.
    # (Same approach as workflows 81/82 in ucsb-cs156-f26/membership-scripts.)
    # If you change the target times, update the cron entries AND the windows
    # in the time-check job together.
    #
    # Cron format: minute hour day-of-month month day-of-week (all UTC)
    # Days of week: 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
    - cron: "30 23 * * *"       # 4:30 PM PDT (UTC-7), every day
    - cron: "30 0 * * *"        # 4:30 PM PST (UTC-8), every day (next day in UTC)
    - cron: "0 2 * * 3,4,5"     # 7:00 PM PDT (UTC-7), Tue/Wed/Thu (next day in UTC)
    - cron: "0 3 * * 3,4,5"     # 7:00 PM PST (UTC-8), Tue/Wed/Thu (next day in UTC)
  workflow_dispatch:  # Allows manual triggering (skips the time check)

jobs:
  # The reusable workflow is called with `uses:` below, and a job that calls a
  # reusable workflow cannot have steps of its own, so the time check lives in
  # this separate job and gates the real job through `needs` / `if`.
  time-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.time-check.outputs.should_run }}
    steps:
      - name: Check if it is 4:30 PM Pacific (any day) or 7:00 PM Pacific (Tue/Wed/Thu)
        id: time-check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Triggered by $EVENT_NAME (not a schedule); skipping the time check."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Current time and day of week in the Pacific timezone
          LOCAL_HOUR=$(TZ="America/Los_Angeles" date +%H)
          LOCAL_MIN=$(TZ="America/Los_Angeles" date +%M)
          LOCAL_DOW=$(TZ="America/Los_Angeles" date +%u)   # 1=Mon ... 7=Sun
          echo "Current Pacific time is $LOCAL_HOUR:$LOCAL_MIN, day of week $LOCAL_DOW"

          # A scheduled run that GitHub delays by a few minutes should still
          # count, so each target is accepted for one hour starting at the
          # target time. The cron entry for the other UTC offset always lands
          # exactly one hour earlier or later, so it falls outside the window,
          # and the two windows (4:30-5:30 PM and 7:00-8:00 PM) do not overlap.
          LOCAL_MINUTES=$((10#$LOCAL_HOUR * 60 + 10#$LOCAL_MIN))
          DIFF_430=$((LOCAL_MINUTES - (16 * 60 + 30)))
          DIFF_700=$((LOCAL_MINUTES - (19 * 60)))

          SHOULD_RUN=false
          if [ "$DIFF_430" -ge 0 ] && [ "$DIFF_430" -lt 60 ]; then
            echo "It is 4:30 PM Pacific (within tolerance). Proceeding with the job."
            SHOULD_RUN=true
          elif [ "$DIFF_700" -ge 0 ] && [ "$DIFF_700" -lt 60 ] && [ "$LOCAL_DOW" -ge 2 ] && [ "$LOCAL_DOW" -le 4 ]; then
            echo "It is 7:00 PM Pacific on a Tue/Wed/Thu (within tolerance). Proceeding with the job."
            SHOULD_RUN=true
          else
            echo "Not one of the target Pacific times. Skipping execution."
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  kanban-slack-update:
    needs: time-check
    if: needs.time-check.outputs.should_run == 'true'
    uses: ucsb-cs156/workflows/.github/workflows/82-kanban-slack-update.yml@main
    with:
      START_DATE: ${{ vars.TEAM02_START_DATE }}
      END_DATE: ${{ vars.TEAM02_END_DATE }}
    secrets:
      PAT: ${{ secrets.CLASSIC_PAT }}
      SLACK_BOT_USER_OAUTH_ACCESS_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
